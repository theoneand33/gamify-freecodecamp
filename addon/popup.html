<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 16px; font: 400 14px/20px system-ui, sans-serif; background: #0a0a23; color: #f5f6f7; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 500; margin: 0; }
  h2 { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
  .num { font-family: ui-monospace, "Hack", monospace; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: #3b3b4f; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
  .bar div { height: 100%; background: #f1be32; }
  .muted { color: #a8a8b8; font-size: 12px; line-height: 16px; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; margin: 16px 0 24px; color: #a8a8b8; }
  dd { margin: 0; color: #f5f6f7; text-align: right; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(245, 246, 247, 0.08); }
  li small { margin-left: auto; color: #858591; font-size: 12px; }
  li.locked { color: #858591; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 4px; background: #f1be32; }
  .locked .dot { background: none; box-shadow: inset 0 0 0 1px #5a5a6e; }
  button {
    margin-top: 16px; padding: 4px 12px; font: inherit; font-size: 12px; line-height: 20px;
    background: none; color: #a8a8b8; border: 1px solid rgba(245, 246, 247, 0.12); border-radius: 6px; cursor: pointer;
    transition: color 150ms cubic-bezier(0.22, 1, 0.36, 1), border-color 150ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  button:hover { color: #f5f6f7; border-color: rgba(245, 246, 247, 0.3); }
  button:focus-visible { outline: 2px solid #f1be32; outline-offset: 2px; }
  button[data-armed] { color: #ff8a8a; border-color: rgba(255, 138, 138, 0.5); }
</style>
</head>
<body>
  <h1 id="level"></h1>
  <div class="bar"><div id="bar"></div></div>
  <div class="muted num" id="next"></div>
  <dl>
    <dt>Total XP</dt><dd class="num" id="xp"></dd>
    <dt>Challenges</dt><dd class="num" id="count"></dd>
    <dt>Streak</dt><dd class="num" id="streak"></dd>
    <dt>Best streak</dt><dd class="num" id="best"></dd>
  </dl>
  <h2>Badges</h2>
  <ul id="badges"></ul>
  <button id="reset">Reset progress</button>
  <script src="game.js"></script>
  <script src="popup.js"></script>
</body>
</html>
